<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 9 - Season by Month</title>
    <style>body { font-family: Arial; margin: 20px; }</style>
</head>
<body>
    <h2>Task 9: Season by Month (Switch Statement)</h2>
    <button onclick="showSeason()">Show Current Season</button>
    <div id="seasonResult" style="margin-top:10px;font-weight:bold;"></div>
    <script>
    function showSeason() {
        const now = new Date();
        const month = now.getMonth();
        let season = '';
        switch(month) {
            case 11: case 0: case 1:
                season = 'Winter'; break;
            case 2: case 3: case 4:
                season = 'Summer'; break;
            case 5: case 6: case 7: case 8:
                season = 'Monsoon'; break;
            case 9: case 10:
                season = 'Autumn'; break;
            default:
                season = 'Unknown';
        }
        document.getElementById('seasonResult').textContent = `Current month: ${now.toLocaleString('default', {month: 'long'})} → Season: ${season}`;
    }
    </script>
</body>
</html>
