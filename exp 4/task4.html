
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Chef Card</title>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
	<style>
		body {
			background: linear-gradient(120deg, #fffbe7 0%, #f7c873 100%);
			font-family: 'Roboto', Arial, sans-serif;
			margin: 0;
		}
		.chef-card {
			width: 420px;
			margin: 64px auto;
			background: #fff; 
			border-radius: 20px; 
			box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); 
			padding: 40px 30px; 
			text-align: center; 
			max-width: 350px; 
			width: 100%; 
			transition: box-shadow 0.3s; 
		}
		.chef-card:hover {
			box-shadow: 0 16px 48px #f7c87388;
			border-color: #ff9800;
		}
		.chef-card img {
			width: 180px;
			height: 180px;
			object-fit: cover;
			border-radius: 50%;
			border: 6px solid #ff9800;
			margin-bottom: 24px;
			background: #fffbe7;
			display: block;
			margin-left: auto;
			margin-right: auto;
			box-shadow: 0 2px 12px #f7c87344;
		}
		   .chef-card h2 {
			   margin: 0 0 16px 0;
			   font-size: 2.2em;
			   font-weight: bold;
			   color: #ff9800;
			   letter-spacing: 1px;
			   font-family: 'Montserrat', Arial, sans-serif;
		   }
		   .chef-card p {
			   color: #444;
			   font-size: 1.13em;
			   margin: 0;
			   line-height: 1.7;
			   padding: 0 8px;
		   }
	</style>
</head>
<body>
	   <div class="chef-card">
		   <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=400&q=80" alt="Random Person">
		   <h2>Jordan Lee</h2>
		   <p>Enthusiastic about technology, travel, and photography. Loves meeting new people and exploring new cultures.</p>
	   </div>
</body>
</html>
